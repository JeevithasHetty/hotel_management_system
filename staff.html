<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 2rem;
    }

    .header a {
      background: #667eea;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    form, .staff-list {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    .staff-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 2px solid #f0f0f0;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }

    .staff-info {
      flex: 1;
    }

    .staff-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .staff-details {
      color: #666;
      font-size: 0.9rem;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    #statusMessage {
      text-align: center;
      font-weight: 500;
      color: #27ae60;
      margin: 15px 0;
      padding: 10px;
      background: #d5f4e6;
      border-radius: 8px;
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-user-tie"></i> Staff Management</h1>
      <a href="index.html">← Back</a>
    </div>

    <form id="staffForm">
      <h2>Add Staff Member</h2>
      <div class="form-group">
        <input type="text" id="name" placeholder="Staff Name" required>
      </div>
      <div class="form-group">
        <input type="text" id="role" placeholder="Role/Position" required>
      </div>
      <div class="form-group">
        <input type="tel" id="contact" placeholder="Contact Number" required>
      </div>
      <button type="submit">Add Staff</button>
    </form>

    <div id="statusMessage"></div>

    <div class="staff-list">
      <h2>Staff Members</h2>
      <div id="staffList"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    function loadStaff() {
      fetch(`${API_BASE}/staffRoute`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('staffList');
          if (data.length === 0) {
            list.innerHTML = '<div class="empty-state">No staff members registered yet</div>';
            return;
          }
          list.innerHTML = '';
          data.forEach(staff => {
            const div = document.createElement('div');
            div.className = 'staff-item';
            div.innerHTML = `
              <div class="staff-info">
                <div class="staff-name">${staff.name}</div>
                <div class="staff-details">Role: ${staff.role} | Contact: ${staff.contact}</div>
              </div>
              <button class="delete-btn" onclick="deleteStaff(${staff.id})">Delete</button>
            `;
            list.appendChild(div);
          });
        })
        .catch(err => console.error('Error loading staff:', err));
    }

    document.getElementById('staffForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const role = document.getElementById('role').value;
      const contact = document.getElementById('contact').value;

      fetch(`${API_BASE}/staffRoute`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role, contact })
      })
        .then(res => res.json())
        .then(data => {
          const msg = document.getElementById('statusMessage');
          msg.textContent = '✓ Staff member added successfully!';
          msg.style.display = 'block';
          document.getElementById('staffForm').reset();
          setTimeout(() => msg.style.display = 'none', 3000);
          loadStaff();
        })
        .catch(err => alert('Error adding staff: ' + err.message));
    });

    function deleteStaff(id) {
      if (!confirm('Are you sure you want to delete this staff member?')) return;
      fetch(`${API_BASE}/staffRoute/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(() => loadStaff())
        .catch(err => alert('Error deleting staff: ' + err.message));
    }

    window.onload = loadStaff;
  </script>
</body>
</html>
