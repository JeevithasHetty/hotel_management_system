<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 2rem;
    }

    .header a {
      background: #667eea;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    form {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    #statusMessage {
      text-align: center;
      font-weight: 500;
      color: #27ae60;
      margin: 15px 0;
      padding: 10px;
      background: #d5f4e6;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-calendar-alt"></i> Booking Management</h1>
      <a href="index.html">← Back</a>
    </div>

    <form id="bookingForm">
      <h2>Create New Booking</h2>
      <div class="form-group">
        <input type="number" id="guest_id" placeholder="Guest ID" required>
      </div>
      <div class="form-group">
        <input type="number" id="room_number" placeholder="Room Number" required>
      </div>
      <div class="form-group">
        <label style="color: #333; margin-bottom: 5px; display: block;">Check-in Date</label>
        <input type="datetime-local" id="check_in" required>
      </div>
      <div class="form-group">
        <label style="color: #333; margin-bottom: 5px; display: block;">Check-out Date</label>
        <input type="datetime-local" id="check_out" required>
      </div>
      <button type="submit">Create Booking</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('bookingForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const guest_id = document.getElementById('guest_id').value;
      const room_number = document.getElementById('room_number').value;
      const check_in = document.getElementById('check_in').value;
      const check_out = document.getElementById('check_out').value;

      fetch(`${API_BASE}/bookings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_id, room_number, check_in, check_out })
      })
        .then(res => res.json())
        .then(data => {
          const msg = document.getElementById('statusMessage');
          msg.textContent = '✓ Booking created successfully!';
          msg.style.display = 'block';
          document.getElementById('bookingForm').reset();
          setTimeout(() => msg.style.display = 'none', 3000);
        })
        .catch(err => alert('Error creating booking: ' + err.message));
    });
  </script>
</body>
</html>
