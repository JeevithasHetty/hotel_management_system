<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Management</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 2rem;
    }

    .header a {
      background: #667eea;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    form, .payment-list {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    .payment-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 2px solid #f0f0f0;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }

    .payment-info {
      flex: 1;
    }

    .payment-id {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .payment-details {
      color: #666;
      font-size: 0.9rem;
    }

    #statusMessage {
      text-align: center;
      font-weight: 500;
      color: #27ae60;
      margin: 15px 0;
      padding: 10px;
      background: #d5f4e6;
      border-radius: 8px;
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-credit-card"></i> Payment Management</h1>
      <a href="index.html">← Back</a>
    </div>

    <form id="paymentForm">
      <h2>Record Payment</h2>
      <div class="form-group">
        <input type="number" id="booking_id" placeholder="Booking ID" required>
      </div>
      <div class="form-group">
        <input type="number" id="amount" placeholder="Amount" step="0.01" required>
      </div>
      <div class="form-group">
        <label style="color: #333; margin-bottom: 5px; display: block;">Payment Date (Optional)</label>
        <input type="date" id="payment_date">
      </div>
      <button type="submit">Record Payment</button>
    </form>

    <div id="statusMessage"></div>

    <div class="payment-list">
      <h2>Payment History</h2>
      <div id="paymentsList"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    function loadPayments() {
      fetch(`${API_BASE}/payments`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('paymentsList');
          if (data.length === 0) {
            list.innerHTML = '<div class="empty-state">No payments recorded yet</div>';
            return;
          }
          list.innerHTML = '';
          data.forEach(payment => {
            const div = document.createElement('div');
            div.className = 'payment-item';
            div.innerHTML = `
              <div class="payment-info">
                <div class="payment-id">Payment ID: ${payment.id} - Booking: ${payment.booking_id}</div>
                <div class="payment-details">Amount: ₹${payment.amount} | Date: ${payment.payment_date}</div>
              </div>
            `;
            list.appendChild(div);
          });
        })
        .catch(err => console.error('Error loading payments:', err));
    }

    document.getElementById('paymentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const booking_id = document.getElementById('booking_id').value;
      const amount = document.getElementById('amount').value;
      const payment_date = document.getElementById('payment_date').value || null;

      fetch(`${API_BASE}/payments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_id, amount, payment_date })
      })
        .then(res => res.json())
        .then(data => {
          const msg = document.getElementById('statusMessage');
          msg.textContent = '✓ Payment recorded successfully!';
          msg.style.display = 'block';
          document.getElementById('paymentForm').reset();
          setTimeout(() => msg.style.display = 'none', 3000);
          loadPayments();
        })
        .catch(err => alert('Error recording payment: ' + err.message));
    });

    window.onload = loadPayments;
  </script>
</body>
</html>
